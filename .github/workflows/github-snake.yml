name: Generate Contribution Snake

on:
  schedule:
    # runs once a day at midnight UTC — edit the cron expression to change frequency
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs from contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Sakshi-patil48
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publishes the generated SVGs to the "output" branch.
      # They then become available at:
      #   https://raw.githubusercontent.com/Sakshi-patil48/Sakshi-patil48/output/github-contribution-grid-snake.svg
      #   https://raw.githubusercontent.com/Sakshi-patil48/Sakshi-patil48/output/github-contribution-grid-snake-dark.svg
      - name: Push snake SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
